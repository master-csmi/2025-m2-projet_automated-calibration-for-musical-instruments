name: automated-calibration-for-musical-instruments CI

on: [push, pull_request]

jobs:
  build:

    runs-on: self-feelpp

    steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install the latest version of uv
              uses: astral-sh/setup-uv@v6
              with:
                version: "latest"
            
            - name: setup Python Venv and install dependencies
              run: |
                python3 -m venv myenv
                source myenv/bin/activate
                pip install -r requirements.txt
                pip install -e .

            - name: Discontinuous Galerkin tests
              run: |
                source myenv/bin/activate
                cd tests/
                pytest test.py -v

            - name: Generate Report pdf
              run: |
                cd doc/Rapport
                pdflatex CSMI-M2-2025-auto-calibration-instrument.tex
                biber CSMI-M2-2025-auto-calibration-instrument
                pdflatex CSMI-M2-2025-auto-calibration-instrument.tex
                pdflatex CSMI-M2-2025-auto-calibration-instrument.tex

            - name: Generate Presentation pdf
              run: |
                cd doc/Slide
                pdflatex CSMI-M2-2025-auto-calibration-instrument-slides.tex
                biber CSMI-M2-2025-auto-calibration-instrument-slides
                pdflatex CSMI-M2-2025-auto-calibration-instrument-slides.tex
                pdflatex CSMI-M2-2025-auto-calibration-instrument-slides.tex